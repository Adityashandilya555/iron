# Production docker-compose for multi-tenant IronClaw deployment
# Usage: docker compose -f docker-compose.prod.yml up -d
#
# Multi-tenant architecture:
# - Per-user concurrency limits (semaphores)
# - Tenant-isolated database queries (TenantScope)
# - Per-user workspaces (WorkspacePool)
# - Per-user cost tracking (CostGuard)

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ironclaw
      POSTGRES_USER: ironclaw
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_in_production}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ironclaw -d ironclaw"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - ironclaw-net
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

  ironclaw:
    image: ${IRONCLAW_IMAGE:-ironclaw/ironclaw:latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env.production
    environment:
      # Database connection
      DATABASE_URL: postgresql://ironclaw:${POSTGRES_PASSWORD:-change_me_in_production}@postgres:5432/ironclaw
      
      # Multi-tenant configuration (CRITICAL)
      AGENT_MULTI_TENANT: "true"
      
      # Per-user concurrency limits
      TENANT_MAX_LLM_CONCURRENT: ${TENANT_MAX_LLM_CONCURRENT:-4}
      TENANT_MAX_JOBS_CONCURRENT: ${TENANT_MAX_JOBS_CONCURRENT:-2}
      
      # Global limits
      AGENT_MAX_PARALLEL_JOBS: ${AGENT_MAX_PARALLEL_JOBS:-20}
      AGENT_JOB_TIMEOUT_SECS: ${AGENT_JOB_TIMEOUT_SECS:-300}
      
      # Cost controls
      MAX_COST_PER_DAY_CENTS: ${MAX_COST_PER_DAY_CENTS:-50000}
      MAX_COST_PER_USER_PER_DAY_CENTS: ${MAX_COST_PER_USER_PER_DAY_CENTS:-1000}
      
      # Session management
      SESSION_IDLE_TIMEOUT_SECS: ${SESSION_IDLE_TIMEOUT_SECS:-3600}
      
      # Gateway
      GATEWAY_HOST: 0.0.0.0
      GATEWAY_PORT: ${GATEWAY_PORT:-3000}
      GATEWAY_AUTH_TOKEN: ${GATEWAY_AUTH_TOKEN:-change_me_in_production}
      
      # Auth mode for multi-user
      AUTH_MODE: ${AUTH_MODE:-single}
      # For multi-token auth, set AUTH_TOKENS=tok1:user1:role1,tok2:user2:role2
      
      # Rate limiting
      CHAT_RATE_LIMIT_PER_MINUTE: ${CHAT_RATE_LIMIT_PER_MINUTE:-30}
      
      # LLM Provider (set in .env.production)
      # LLM_PROVIDER: openai
      # OPENAI_API_KEY: ${OPENAI_API_KEY}
      
    ports:
      - "${GATEWAY_PORT:-3000}:3000"
    volumes:
      - ironclaw-workspaces:/var/lib/ironclaw/workspaces
      - ironclaw-skills:/var/lib/ironclaw/skills
    networks:
      - ironclaw-net
    deploy:
      resources:
        limits:
          memory: ${IRONCLAW_MEMORY_LIMIT:-4G}
        reservations:
          memory: 1G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Optional: Redis for distributed rate limiting (uncomment for cluster deployment)
  # redis:
  #   image: redis:7-alpine
  #   restart: unless-stopped
  #   volumes:
  #     - redisdata:/data
  #   networks:
  #     - ironclaw-net
  #   deploy:
  #     resources:
  #       limits:
  #         memory: 256M

networks:
  ironclaw-net:
    driver: bridge

volumes:
  pgdata:
    driver: local
  ironclaw-workspaces:
    driver: local
  ironclaw-skills:
    driver: local
  # redisdata:
  #   driver: local